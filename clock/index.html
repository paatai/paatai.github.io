 else if(m[0][0]>m[1][1]&&m[0][0]>m[2][2]){const s=Math.sqrt(1+m[0][0]-m[1][1]-m[2][2])*2;w=(m[2][1]-m[1][2])/s;x=s/4;y=(m[0][1]+m[1][0])/s;z=(m[0][2]+m[2][0])/s}
 else if(m[1][1]>m[2][2]){const s=Math.sqrt(1+m[1][1]-m[0][0]-m[2][2])*2;w=(m[0][2]-m[2][0])/s;x=(m[0][1]+m[1][0])/s;y=s/4;z=(m[1][2]+m[2][1])/s}
 else{const s=Math.sqrt(1+m[2][2]-m[0][0]-m[1][1])*2;w=(m[1][0]-m[0][1])/s;x=(m[0][2]+m[2][0])/s;y=(m[1][2]+m[2][1])/s;z=s/4}return [w,x,y,z]}
function q2m(q){const[w,x,y,z]=q;return[[1-2*(y*y+z*z),2*(x*y-w*z),2*(x*z+w*y)],[2*(x*y+w*z),1-2*(x*x+z*z),2*(y*z-w*x)],[2*(x*z-w*y),2*(y*z+w*x),1-2*(x*x+y*y)]]}
function qm(a,b){return[a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]]}

function slerp(a,b,t){let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];if(d<0){b=b.map(v=>-v);d=-d}if(d>.9995)return nq(a.map((v,i)=>v+(b[i]-v)*t));const th=Math.acos(d),s=Math.sin(th);return a.map((v,i)=>(Math.sin((1-t)*th)*v+Math.sin(t*th)*b[i])/s)}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const hp=new URLSearchParams(location.hash.slice(1)),qp=new URLSearchParams(location.search);
const param=k=>hp.has(k)?hp.get(k):qp.get(k),has=k=>hp.has(k)||qp.has(k);
const NB=6,OFF=[0,3,6,0,2,5];
const balls=Array.from({length:NB},()=>({d:-1,q:VQ[0].slice(),a:null}));
let demo=param('demo')==='1',dT=0;
function digits(now){if(has('time'))return parseTime(param('time'));
 if(has('digit'))return Array(NB).fill(mod10(param('digit')));
 if(demo){const k=Math.floor((now-dT)/2200)%10;return OFF.map(o=>(k+o)%10)}
 const d=new Date(),h=d.getHours(),m=d.getMinutes(),sec=d.getSeconds();
 return[h/10|0,h%10,m/10|0,m%10,sec/10|0,sec%10]}
function mod10(v){return ((Math.trunc(+v)%10)+10)%10}
function parseTime(raw){const parts=String(raw).split(':');
 const pair=n=>{n=Math.abs(Math.trunc(+n))%100;return[n/10|0,n%10]};
 if(parts.length>=2&&parts.every(p=>/^\d{1,2}$/.test(p))){const ss=parts.length>=3?+parts[2]:0;return[...pair(parts[0]),...pair(parts[1]),...pair(ss)]}
 const t=String(raw).replace(/\D/g,'');
 const body=t.length>=5?(t+'000000').slice(0,6):(t.padStart(4,'0').slice(-4)+'00');
 return[...body].map(ch=>+ch)}
const snap=param('snap')==='1'||has('time')||has('digit');
// Ones-of-seconds changes every second, so that morph finishes and the digit stays readable.
function morphDur(i){return i>=5?480:1700}
function frame(now){if(has('ft'))now=+param('ft');const dg=digits(now);
 if(demo){const t=has('ft')?now:now-dT,k=Math.floor(t/2200),ph=Math.min(1,(t%2200)/1700);
  for(let i=0;i<NB;i++){const off=OFF[i],cur=(k+off)%10,prev=(k+off+9)%10,b=balls[i];if(b.drag)continue;b.d=cur;const tg=k>0?slerp(VQ[prev],VQ[cur],ease(ph)):VQ[cur].slice();if(b.a){const u=Math.min(1,(now-b.a.t0)/b.a.dur);b.q=slerp(b.a.from,tg,ease(u));if(u>=1)b.a=null}else b.q=tg}}
 else
 for(let i=0;i<NB;i++){const b=balls[i];if(dg[i]!==b.d){if(b.d<0||snap)b.q=VQ[dg[i]].slice();else if(!b.drag)b.a={from:b.q.slice(),t0:now,dur:morphDur(i)};b.d=dg[i]}
  if(b.drag){b.a=null}else if(b.a){const u=Math.min(1,(now-b.a.t0)/b.a.dur);b.q=slerp(b.a.from,VQ[b.d],ease(u));if(u>=1)b.a=null}}
 const layo=lay();
 gl.viewport(0,0,c.width,c.height);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
 const gain=+param('gain')||1.3,fa=+(param('fa')||0.5);
 for(let i=0;i<NB;i++){const b=balls[i],p=layo.balls[i];const wob=snap?[1,0,0,0]:nq([1,0.012*Math.sin(now/1900+i*1.7),0.012*Math.sin(now/2300+i),0]);
  const m=q2m(b.drag?b.q:qm(b.q,wob));
  const px=Math.round((p.cx-p.R)*dpr),py=Math.round((p.cy-p.R)*dpr),sz=Math.max(1,Math.round(2*p.R*dpr));
  gl.viewport(px,c.height-py-sz,sz,sz);
  const ps=Math.max(1,p.R*dpr/115),amp=Math.min(1,gain*Math.pow(p.R*dpr,2)/(n*ps*ps));
  gl.uniform3fv(L.r,m[0]);gl.uniform3fv(L.u,m[1]);gl.uniform1f(L.ps,ps);gl.uniform1f(L.amp,amp);gl.uniform1f(L.fa,fa);gl.uniform3fv(L.dv,m[2]);
  gl.drawArrays(gl.POINTS,0,n+NF)}
 g.clearRect(0,0,W,H);
 const col=layo.colon,rr=Math.max(3,layo.unit*0.045);
 for(const s of[-1,1]){const y=col.cy+s*col.R*0.38;const gr=g.createRadialGradient(col.cx,y,0,col.cx,y,rr*2.2);gr.addColorStop(0,'rgba(215,230,255,.95)');gr.addColorStop(.45,'rgba(170,190,255,.5)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(col.cx,y,rr*2.2,0,7);g.fill()}
 requestAnimationFrame(frame)}
function lay(){
 // Seconds: two balls at 52% of the main radius, side by side under the minutes-ones ball.
 // HH:MM keeps the original row (unit = W/4.9) and stays centered unless the pair would clip.
 const margin=Math.max(12,Math.min(W,H)*0.02),scale=0.52,gapK=0.45,vg=0.22;
 const hK=0.47*(2+vg+2*scale);
 const unit=Math.min(W/4.9,(H-2*margin)/hK);
 const R=unit*0.47,gap=unit*gapK,Rs=R*scale,vgap=Math.max(10,vg*R);
 const x0=(W-4*unit-gap)/2;
 let cy=H/2,need=vgap+2*Rs;
 if(cy+R+need>H-margin)cy=H-margin-R-need;
 if(cy-R<margin)cy=margin+R;
 const P=[];
 for(let i=0;i<4;i++)P.push({cx:x0+unit*(i+.5)+(i>=2?gap:0),cy,R});
 const sep=Rs/0.47*1.04,cyS=cy+R+vgap+Rs;
 let s0=P[3].cx-sep/2,s1=P[3].cx+sep/2;
 const pushL=Math.max(0,(s1+Rs)-(W-margin));s0-=pushL;s1-=pushL;
 const pushR=Math.max(0,margin-(s0-Rs));s0+=pushR;s1+=pushR;
 P.push({cx:s0,cy:cyS,R:Rs},{cx:s1,cy:cyS,R:Rs});
 return{unit,R,cy,gap,x0,balls:P,colon:{cx:x0+2*unit+gap/2,cy,R}}}
const drags={};
c.addEventListener('pointerdown',e=>{const P=lay().balls;let best=-1,bestD=1e9;
 for(let i=0;i<NB;i++){const p=P[i],d=Math.hypot(e.clientX-p.cx,e.clientY-p.cy);if(d<p.R*1.05&&d/p.R<bestD){best=i;bestD=d/p.R}}
 if(best<0)return;const b=balls[best];b.drag=true;b.a=null;drags[e.pointerId]={i:best,x:e.clientX,y:e.clientY,R:P[best].R};c.setPointerCapture(e.pointerId);e.preventDefault()});
c.addEventListener('pointermove',e=>{const d=drags[e.pointerId];if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;d.x=e.clientX;d.y=e.clientY;
 const l=Math.hypot(dx,dy);if(!l)return;const ang=l/d.R,s=Math.sin(ang/2);const qd=[Math.cos(ang/2),-dy/l*s,dx/l*s,0];const b=balls[d.i];b.q=nq(qm(qd,b.q));e.preventDefault()});
function up(e){const d=drags[e.pointerId];if(!d)return;delete drags[e.pointerId];const b=balls[d.i];b.drag=false;b.a={from:b.q.slice(),t0:performance.now(),dur:1000}}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('contextmenu',e=>e.preventDefault());
const ov=document.createElement('canvas');ov.style.pointerEvents='none';document.body.appendChild(ov);const g=ov.getContext('2d');
function ors(){ov.width=W*dpr;ov.height=H*dpr;ov.style.width=W+'px';ov.style.height=H+'px';g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',ors);ors();
requestAnimationFrame(frame);
